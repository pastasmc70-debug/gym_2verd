{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">{{ gym_nombre }}</h1>
        <p class="text-muted">Ingresá con tu usuario y clave de administrador.</p>
        <form method="post" novalidate>
          {{ csrf() }}
          <div class="mb-3">
            <label class="form-label" for="usuario">Usuario</label>
            <input class="form-control" id="usuario" name="usuario" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="clave">Clave</label>
            <input class="form-control" type="password" id="clave" name="clave" autocomplete="current-password" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
